<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webmail Snapshot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="p-3">
    <div class="container">
      <h3>Webmail Snapshot</h3>
      <table class="table table-sm table-striped">
        <thead><tr><th>Date</th><th>From</th><th>Subject</th><th>Category</th><th>Assigned</th><th>Status</th></tr></thead>
        <tbody>
        {% for e in emails %}
          <tr>
            <td>{{ e.date }}</td>
            <td>{{ e.sender }}</td>
            <td>{{ e.subject }}</td>
            <td>{{ e.category }}</td>
            <td>{{ e.assigned_to }}</td>
            <td>{{ e.status }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
